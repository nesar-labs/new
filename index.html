<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advance Birthday Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: min(500px, 92%);
            padding: 30px 25px;

            background: white;
            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;

            font-weight: bold;
        }

        select,
        button {
            width: 100%;
            padding: 12px;

            font-size: 16px;
            border-radius: 8px;
        }

        select {
            border: 1px solid #ccc;
            background: white;
        }

        #generateBtn {
            margin-top: 25px;

            border: none;
            background: #4caf50;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        #generateBtn:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 25px;

            min-height: 50px;

            font-size: 18px;
            font-style: italic;

            overflow-wrap: anywhere;
        }

        #copyBtn {
            margin-top: 15px;

            border: 1px solid #ccc;
            background: #e7e7e7;

            cursor: pointer;

            display: none;
        }

        #copyBtn:disabled {
            cursor: default;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        .normal {
            color: #1976d2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎂 Advance Birthday Generator</h1>

    <label for="month">Select Birth Month:</label>

    <select id="month">
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11" selected>November</option>
        <option value="12">December</option>
    </select>

    <label for="day">Select Birth Day:</label>

    <select id="day">
        <!-- Days generated by JavaScript -->
    </select>

    <button id="generateBtn">
        Generate Wishes
    </button>

    <div id="result"></div>

    <button id="copyBtn">
        📋 Copy to Clipboard
    </button>

</div>

<script>

    // -------------------------------
    // Create day options
    // -------------------------------

    const daySelect = document.getElementById("day");

    for (let day = 1; day <= 31; day++) {

        const option = document.createElement("option");

        option.value = day;
        option.textContent = day;

        if (day === 5) {
            option.selected = true;
        }

        daySelect.appendChild(option);
    }


    // -------------------------------
    // Get HTML elements
    // -------------------------------

    const monthSelect = document.getElementById("month");
    const generateBtn = document.getElementById("generateBtn");
    const result = document.getElementById("result");
    const copyBtn = document.getElementById("copyBtn");


    // Store generated message
    let generatedMessage = "";


    // -------------------------------
    // Generate birthday wishes
    // -------------------------------

    function calculateAdvanceWishes() {

        const month = Number(monthSelect.value);
        const day = Number(daySelect.value);

        const today = new Date();

        /*
            Create this year's birthday.
            Month is zero-based in JavaScript:
            January = 0
            February = 1
            ...
            December = 11
        */

        let birthdayThisYear = new Date(
            today.getFullYear(),
            month - 1,
            day
        );


        // Check for invalid dates such as February 30

        if (
            birthdayThisYear.getMonth() !== month - 1 ||
            birthdayThisYear.getDate() !== day
        ) {

            result.textContent =
                "❌ Invalid date selection (e.g. Feb 30)!";

            result.className = "error";

            copyBtn.style.display = "none";

            return;
        }


        // If birthday already happened this year,
        // use next year.

        let targetBirthday;

        if (birthdayThisYear < today) {

            targetBirthday = new Date(
                today.getFullYear() + 1,
                month - 1,
                day
            );

        } else {

            targetBirthday = birthdayThisYear;

        }


        // Remove time from both dates so that
        // we count calendar days.

        const todayDate = new Date(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
        );

        const birthdayDate = new Date(
            targetBirthday.getFullYear(),
            targetBirthday.getMonth(),
            targetBirthday.getDate()
        );


        // Calculate milliseconds between dates

        const difference =
            birthdayDate - todayDate;


        // Convert milliseconds → days

        const daysLeft =
            Math.round(difference / (1000 * 60 * 60 * 24));


        // -------------------------------
        // Generate message
        // -------------------------------

        if (daysLeft === 0) {

            generatedMessage =
                "🎉 Happy Birthday today!! 🎉";

            result.textContent = generatedMessage;
            result.className = "success";

        } else {

            const advanceString =
                "advance ".repeat(daysLeft).trim();

            generatedMessage =
                `Happy birthday in ${advanceString}!`;

            result.textContent = generatedMessage;
            result.className = "normal";
        }


        // Show copy button

        copyBtn.textContent =
            "📋 Copy to Clipboard";

        copyBtn.disabled = false;

        copyBtn.style.display = "block";
    }


    // -------------------------------
    // Copy message
    // -------------------------------

    async function copyToClipboard() {

        try {

            await navigator.clipboard.writeText(
                generatedMessage
            );

            copyBtn.textContent =
                "✅ Copied!";

            copyBtn.disabled = true;

        } catch (error) {

            /*
                Fallback for browsers that don't
                allow navigator.clipboard.
            */

            const textarea =
                document.createElement("textarea");

            textarea.value = generatedMessage;

            document.body.appendChild(textarea);

            textarea.select();

            document.execCommand("copy");

            textarea.remove();

            copyBtn.textContent =
                "✅ Copied!";

            copyBtn.disabled = true;
        }
    }


    // -------------------------------
    // Button events
    // -------------------------------

    generateBtn.addEventListener(
        "click",
        calculateAdvanceWishes
    );

    copyBtn.addEventListener(
        "click",
        copyToClipboard
    );

</script>

</body>
</html>
